# End-to-end smoke test on ONE GPU: LoRA, 4 optimisation steps, checkpoint + validation every 2 steps.
# Exercises dataset/augmentation -> loss -> checkpoint -> validation sampling.  Not a training recipe.
MODEL_PATH=THUDM/CogVideoX-5b-I2V
TRAINING_TYPE=lora
LORA_RANK=16
LORA_ALPHA=8
ACCELERATE_CONFIG_FILE=$STM_HOME/training/configs/accelerate/single_gpu.yaml

BATCH_SIZE=1
GRAD_ACC_STEPS=1
TOTAL_TRAIN_STEPS=4
LEARNING_RATE=1e-4
LR_WARMUP_STEPS=1
CHECKPOINT_STEPS=2
CHECKPOINT_LIMIT=1
RESUME=false

TRAIN_DIR=$STM_DATA/datasets/stm_gen
FILTERING_METHOD=1fg-1bg        # use every clip (also the validation-only DAVIS ones) for the smoke test
VAL_DIR=$STM_DATA/datasets/stm_gen
VAL_STEPS=2
VAL_NUM_SAMPLES=1
INFERENCE_STEPS=8
VAL_GUIDANCE_SCALES="6.0"
