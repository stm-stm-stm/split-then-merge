# StM Composer - main training recipe (paper Sec. 4.1)
#   CogVideoX-5b-I2V, full fine-tuning, 20K iterations, batch 64 (16 x H100 x 2 x 2 grad-acc),
#   AdamW (0.9, 0.95, eps 1e-8, wd 1e-4), cosine LR 5e-6 with 1K warm-up, bf16,
#   49x480x720, identity-preservation loss with alpha = 0.5, transformation-aware augmentation.
# Paths may reference $STM_HOME (repo) and $STM_DATA (bulk storage).

MODEL_PATH=THUDM/CogVideoX-5b-I2V        # or a local snapshot path
MODEL_NAME=cogvideox-i2v
MODEL_TYPE=i2v
TRAINING_TYPE=sft
TRAIN_RESOLUTION=49x480x720

BATCH_SIZE=2
GRAD_ACC_STEPS=2
TOTAL_TRAIN_STEPS=20000
LEARNING_RATE=5e-6
LR_WARMUP_STEPS=1000
LR_SCHEDULER=cosine
CHECKPOINT_STEPS=500
CHECKPOINT_LIMIT=2
RESUME=true
ACCELERATE_CONFIG_FILE=$STM_HOME/training/configs/accelerate/fsdp2_1node_4gpu.yaml

# data (generated by data_processing/generate_data.py)
TRAIN_DIR=$STM_DATA/datasets/stm_gen
FILTERING_METHOD=main_train_foreground_volume   # metadata.csv column: 1 fg, >35 frames, fg ratio in [0.01, 0.45]
FG_COLUMN=fg-black.txt
BG_COLUMN=bg.txt
AUG_CONFIG_PATH=$STM_HOME/training/configs/augmentation/paper.yaml   # flip 0.7 / resized-crop 0.7 keeping 90% fg / jitter 0.2 (Sec. 4.1)
VAL_DIR=$STM_DATA/datasets/stm_val
VAL_STEPS=1000
VAL_GUIDANCE_SCALES="6.0"
INFERENCE_STEPS=50

# StM Composer (paper setting)
I2V_TRAINING_TYPE=fg_plain_bg_noisy
APPLY_FG_NOISE=True
NOISE_MEAN_FG=-1.0
APPLY_BG_NOISE=True
NOISE_MEAN_BG=-3.0
APPLY_MASK_ON_LATENTS_FG=True
APPLY_MASK_ON_LATENTS_BG=False
APPLY_MASK_ON_ORIG_LOSS=True     # identity-preservation loss (Eq. 3-4)
FG_WEIGHT_ON_ORIG_LOSS=0.5       # alpha
WEIGHT_ORIG=1.0
WEIGHT_FG=0.0
WEIGHT_BG=0.0
